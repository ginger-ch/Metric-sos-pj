name: Project Task
description: Create a new task
title: "[TASK] "
labels: ["task"]
assignees:
  - 

body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the task category
      options:
        - Design
        - Development
        - Documentation
        - Deployment
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Task Type
      description: What type of task is this?
      options:
        - User Flow
        - Figma UI
        - Wireframe
        - Frontend Feature
        - Backend API
        - Database
        - Bug Fix
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Clearly describe what needs to be done
      placeholder: |
        Example:
        - Create login screen UI
        - Connect to backend API
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be completed for this task to be done?
      placeholder: |
        - UI matches Figma design
        - Login API works correctly
        - No console errors
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimated Time (hours)
      placeholder: e.g., 4