name: Project Task
description: Create a new task
title: "[TASK] "
labels: ["task"]
assignees:
  - 

body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the task category
      options:
        - Design
        - Development
        - Documentation
        - Deployment
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Task Type
      description: What type of task is this?
      options:
        - User Flow
        - Figma UI
        - Wireframe
        - Frontend Feature
        - Backend API
        - Database
        - Bug Fix
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Clearly describe what needs to be done
      placeholder: |
        Example:
        - Create login screen UI
        - Connect to backend API
    validations:
      required: true

  - type: checkboxes
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Conditions that must be met before this task is considered complete
      options:
        - label: Home page matches Figma UI design
        - label: Page is fully responsive (mobile, tablet, desktop)
        - label: Interactive elements work correctly (buttons, nav, etc.)
        - label: Product data is fetched successfully from API
        - label: Data displays correctly on the home page
        - label: Loading state is handled (spinner or skeleton)
        - label: Error state is handled gracefully
        - label: Navigation links work correctly
        - label: No console errors in browser
        - label: Tested and working on latest build
        - label: Code pushed to feature branch
        - label: Pull request created for review

  - type: input
    id: estimate
    attributes:
      label: Estimated Time (hours)
      placeholder: e.g., 4