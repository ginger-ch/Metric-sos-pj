name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - octocat

body:
  - type: markdown
    attributes:
      value: |
       Fill out this bug report!

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did this bug occur?
      placeholder: "e.g. production / staging / local"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (system down)
        - High (major feature broken)
        - Medium (feature partially broken)
        - Low (minor issue)
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version / Branch
      description: Which version or branch are you on?
      options:
        - main
        - develop
        - other
    validations:
      required: true

  - type: textarea
    id: possible-cause
    attributes:
      label: Possible Cause / Related Code
      description: If you have any idea where the bug might be, mention it here.
      placeholder: "e.g. admin-controller.js line 42"
